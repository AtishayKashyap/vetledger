# Render Blueprint, free tier. External free services:
#   Postgres -> Neon (`neon deploy` or the console; see docs/DEPLOY.md)
#   Redis    -> Upstash (use the rediss:// URL)
# One web service runs API + reminder worker (RUN_WORKER=true), so only one free
# instance is needed. Free instances sleep when idle; BullMQ's job scheduler state lives
# in Redis, so overdue scans run as soon as the instance wakes.
services:
  - type: web
    name: vetledger-api
    runtime: docker
    dockerfilePath: apps/api/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /healthz
    envVars:
      - { key: DATABASE_URL, sync: false }           # Neon pooled URL (owner creds are fine)
      - { key: DATABASE_URL_UNPOOLED, sync: false }  # Neon direct URL: migrations on boot
      - { key: APP_DB_PASSWORD, generateValue: true } # API connects as vetledger_app (RLS enforced)
      - { key: REDIS_URL, sync: false }
      - { key: JWT_SECRET, generateValue: true }
      - { key: COOKIE_SECURE, value: "true" }
      # Browser -> Vercel rewrite -> Render proxy -> app: trust both hops so rate
      # limiting keys on the real client IP, not Vercel's.
      - { key: TRUST_PROXY, value: "2" }
      - { key: RUN_WORKER, value: "true" }
      - { key: WORKER_DRAIN_DELAY_SEC, value: "60" }   # stay inside Upstash's free quota
      - { key: REMINDER_WEBHOOK_URL, sync: false }
      - { key: OTEL_EXPORTER_OTLP_ENDPOINT, sync: false }
      - { key: OTEL_EXPORTER_OTLP_HEADERS, sync: false }
