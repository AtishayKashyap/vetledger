# Full stack:   docker compose up --build        -> http://localhost:8080
# Seed demo:    docker compose run --rm api node dist/seed.js
# Observability: docker compose --profile observability up  (Prometheus :9090, Jaeger :16686)
x-api-env: &api-env
  DATABASE_URL: postgres://vetledger_app:app@postgres:5432/vetledger
  MIGRATION_DATABASE_URL: postgres://vetledger_owner:owner@postgres:5432/vetledger
  REDIS_URL: redis://redis:6379
  JWT_SECRET: ${JWT_SECRET:-local-compose-secret-change-me-0123456789}
  TRUST_PROXY: "1"
  RUN_WORKER: "true"
  REMINDER_SCAN_EVERY_MS: "60000"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    environment:
      <<: *api-env
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    ports: ["4000:4000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    ports: ["8080:8080"]
    depends_on: [api]

  prometheus:
    profiles: [observability]
    image: prom/prometheus:v2.55.1
    volumes: ["./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]

  jaeger:
    # Set OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318 for the api to export traces here.
    profiles: [observability]
    image: jaegertracing/all-in-one:1.62.0
    ports: ["16686:16686", "4318:4318"]

volumes:
  pgdata:
