name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TEST_DATABASE_URL: postgres://vetledger_app:app@localhost:5432/vetledger_test
  TEST_MIGRATION_DATABASE_URL: postgres://vetledger_owner:owner@localhost:5432/vetledger_test
  TEST_REDIS_URL: redis://localhost:6379/1

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 3s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Create database roles (owner for migrations, app for runtime/RLS)
        run: psql postgres://postgres:postgres@localhost:5432/postgres -v ON_ERROR_STOP=1 -c "CREATE ROLE vetledger_owner LOGIN CREATEROLE PASSWORD 'owner'" -c "CREATE ROLE vetledger_app LOGIN PASSWORD 'app'" -c "CREATE DATABASE vetledger_test OWNER vetledger_owner" && psql postgres://postgres:postgres@localhost:5432/vetledger_test -c "CREATE EXTENSION pgcrypto" -c "CREATE EXTENSION citext"
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Unit + integration tests (real Postgres 16 + Redis 7, coverage gate)
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Dependency audit
        run: pnpm audit --prod --audit-level high

  e2e:
    needs: test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgres://vetledger_app:app@localhost:5432/vetledger
      MIGRATION_DATABASE_URL: postgres://vetledger_owner:owner@localhost:5432/vetledger
      JWT_SECRET: ci-e2e-secret-ci-e2e-secret-0123456789
      LOG_LEVEL: warn
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: psql postgres://postgres:postgres@localhost:5432/postgres -v ON_ERROR_STOP=1 -c "CREATE ROLE vetledger_owner LOGIN CREATEROLE PASSWORD 'owner'" -c "CREATE ROLE vetledger_app LOGIN PASSWORD 'app'" -c "CREATE DATABASE vetledger OWNER vetledger_owner" && psql postgres://postgres:postgres@localhost:5432/vetledger -c "CREATE EXTENSION pgcrypto" -c "CREATE EXTENSION citext"
      - run: pnpm db:migrate && pnpm db:seed
      - run: pnpm --filter @vetledger/api build
      - name: Start API
        run: |
          node apps/api/dist/server.js > api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:4000/readyz && exit 0; sleep 1; done
          cat api.log; exit 1
      - run: pnpm --filter @vetledger/web exec playwright install --with-deps chromium
      - run: pnpm --filter @vetledger/web e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with: { name: playwright-report, path: apps/web/playwright-report }

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build images
        run: |
          docker build -f apps/api/Dockerfile -t vetledger-api:ci .
          docker build -f apps/web/Dockerfile -t vetledger-web:ci .
      - name: Smoke test the full stack with docker compose
        run: |
          docker compose up -d --build
          for i in $(seq 1 60); do curl -sf localhost:4000/readyz && break; sleep 2; done
          docker compose run --rm api node dist/seed.js
          curl -sf -H 'content-type: application/json' -d '{"email":"vet@sunrise.vet","password":"vetledger-demo"}' localhost:8080/api/auth/login | grep -q accessToken
          docker compose down -v
      - name: Scan API image (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: vetledger-api:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
